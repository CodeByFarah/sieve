[project]
name = "sieve"
version = "0.1.0"
description = "Evidence-backed dependency vulnerability triage: which vulnerabilities actually reach your code."
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.0",
    "boto3>=1.35",
    "cvss>=3.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-exporter-prometheus>=0.66b0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "packaging>=24.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "redis>=5.2",
    "sqlalchemy>=2.0.32",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
sieve-worker = "sieve.worker.__main__:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.108",
    "httpx2",  # used by starlette.testclient
    "moto[s3]>=5",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.23.1",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sieve"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "BLE", "A", "C4", "DTZ", "T20", "RET", "SIM", "PTH", "RUF"]
# N818: domain exception names (SecurityRejection, PermissionDenied) read better without "Error".
ignore = ["N818", "SIM114"]
allowed-confusables = ["×"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: safe as defaults.
extend-immutable-calls = ["sieve.core.archives.ArchiveLimits", "sieve.analysis.engine.EngineLimits"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; tests use fixed fake secrets and seeded non-crypto RNGs.
"tests/**" = ["S101", "S105", "S106", "S311", "E501"]
# Alembic revisions are generated, then hand-reviewed.
"src/sieve/db/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# Production runs on Linux; checking for it keeps POSIX-only code (resource limits) typed.
platform = "linux"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cvss", "cvss.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires PostgreSQL (SIEVE_TEST_DATABASE_URL)",
]
filterwarnings = ["error"]
