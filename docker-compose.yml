# Local development stack. Credentials here are for local use only.
name: sieve

x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/docker/backend.Dockerfile
  environment:
    SIEVE_ENVIRONMENT: development
    SIEVE_DATABASE_URL: postgresql+psycopg://sieve:sieve@postgres:5432/sieve
    SIEVE_LOG_JSON: "false"
    # The demo uses the recorded advisory snapshot, so live ingestion is off locally by default.
    # It would otherwise run first on the single worker and delay the demo scan by minutes.
    # Set SIEVE_INGEST_EVERY_HOURS=24 to ingest live OSV, KEV and EPSS data.
    SIEVE_INGEST_OSV_EVERY_HOURS: ${SIEVE_INGEST_EVERY_HOURS:-0}
    SIEVE_INGEST_KEV_EVERY_HOURS: ${SIEVE_INGEST_EVERY_HOURS:-0}
    SIEVE_INGEST_EPSS_EVERY_HOURS: ${SIEVE_INGEST_EVERY_HOURS:-0}
  volumes:
    - ./backend/src:/app/src:ro
    # Shared so the API can serve artifacts (SBOMs, reports) that the worker writes.
    - artifacts:/scratch/artifacts

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sieve
      POSTGRES_PASSWORD: sieve
      POSTGRES_DB: sieve
      TZ: UTC
    ports:
      - "127.0.0.1:${SIEVE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sieve -d sieve"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command:
      ["uvicorn", "sieve.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000",
       "--reload", "--reload-dir", "/app/src"]
    ports:
      - "127.0.0.1:${SIEVE_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["python", "-m", "sieve.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        SIEVE_API_URL: http://api:8000
    environment:
      SIEVE_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${SIEVE_WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  artifacts:
